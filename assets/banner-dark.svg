<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
  <title id="t">Neuroslop League</title>
  <desc id="d">Banner of the Neuroslop League GitHub organization: organization name and a terminal running the mythical neuroslop CLI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#0E0E0E"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#A6A6A6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4D4D4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#D4D4D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#2B2B2B" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="328" rx="22"/></clipPath>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      .caret { animation: blink 1.15s steps(1, end) infinite; }
      .pulse { animation: pulse 3.6s ease-in-out infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
      @media (prefers-reduced-motion: reduce) { .caret, .pulse { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="330" fill="url(#bg)"/>
    <rect width="1000" height="330" fill="url(#dots)"/>
    <ellipse cx="110" cy="-10" rx="380" ry="250" fill="url(#glowA)"/>
    <ellipse cx="930" cy="340" rx="340" ry="230" fill="url(#glowB)"/>
    <rect width="1000" height="2.4" fill="url(#name)" opacity="0.85"/>

    <circle class="pulse" cx="59" cy="62" r="4.2" fill="#FFFFFF"/>
    <text x="73" y="66" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="3.4" fill="#E5E5E5">GITHUB ORGANIZATION</text>

    <text x="54" y="132" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.2" fill="url(#name)">NEUROSLOP</text>
    <text x="54" y="224" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.2" fill="url(#name)">LEAGUE</text>
    <text x="56" y="250" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="2.2" fill="#E5E5E5">NEUROSLOP LEAGUE — EST. 2026</text>
    <text x="56" y="292" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#A3A3A3">An independent collective of vibe coders &amp; slop enthusiasts.</text>

    <g filter="url(#lift)">
      <rect x="588" y="54" width="356" height="222" rx="14" fill="#080808" stroke="#2A2A2A" stroke-width="1"/>
    </g>
    <path d="M588 87 h356" stroke="#2A2A2A" stroke-width="1"/>
    <circle cx="609" cy="70.5" r="4" fill="#FFFFFF" opacity="0.88"/>
    <circle cx="626" cy="70.5" r="4" fill="#999999" opacity="0.78"/>
    <circle cx="643" cy="70.5" r="4" fill="#525252" opacity="0.78"/>
    <text x="926" y="74" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#737373">zsh</text>
      <text x="612" y="108" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" xml:space="preserve" direction="ltr"><tspan fill="#FFFFFF">$</tspan> <tspan fill="#F5F5F5">neuroslop gen "cat in space"</tspan></text>
      <text x="612" y="129" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" xml:space="preserve" direction="ltr"><tspan fill="#D4D4D4">&#10003; cat_space_final_v27.png</tspan></text>
      <text x="612" y="158" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" xml:space="preserve" direction="ltr"><tspan fill="#FFFFFF">$</tspan> <tspan fill="#F5F5F5">grep quality /dev/null</tspan></text>
      <text x="612" y="179" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" xml:space="preserve" direction="ltr"><tspan fill="#737373">grep: quality: not found</tspan></text>
      <text x="612" y="208" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" xml:space="preserve" direction="ltr"><tspan fill="#FFFFFF">$</tspan> <tspan fill="#F5F5F5">ls</tspan></text>
      <text x="612" y="229" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" xml:space="preserve" direction="ltr"><tspan fill="#D4D4D4">ideas/</tspan>  <tspan fill="#D4D4D4">slop/</tspan>  <tspan fill="#D4D4D4">final/</tspan></text>
      <text x="612" y="257" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" xml:space="preserve" direction="ltr"><tspan fill="#FFFFFF">$</tspan></text>
    <rect class="caret" x="626" y="246" width="7" height="13.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <rect x="1" y="1" width="998" height="328" rx="22" fill="none" stroke="#262626" stroke-width="1"/>
</svg>
