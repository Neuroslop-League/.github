<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="lt">
  <title id="lt">Language split across 2 public Neuroslop-League repositories: Python 74%, Rust 21%, C++ 4%, Shell 0%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F4F4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#525252" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#525252" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#D4D4D4" fill-opacity="0.75"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="228" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <rect width="1000" height="230" fill="url(#dots)"/>
    <ellipse cx="60" cy="10" rx="300" ry="150" fill="url(#glowA)"/>
    <ellipse cx="950" cy="230" rx="300" ry="150" fill="url(#glowB)"/>

    <text x="56" y="44" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="3.2" fill="#000000">LANGUAGES &#183; PUBLIC ORG REPOS</text>
    <text x="944" y="44" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#808080">2 repos &#183; 136.6 kB of code</text>

      <rect x="56.0" y="66" width="652.5" height="26" rx="4" fill="#0A0A0A"><title>Python — 74.2%</title></rect>
      <rect x="711.5" y="66" width="185.2" height="26" rx="4" fill="#333333"><title>Rust — 21.1%</title></rect>
      <rect x="899.7" y="66" width="37.3" height="26" rx="4" fill="#595959"><title>C++ — 4.2%</title></rect>
      <rect x="940.1" y="66" width="4.0" height="26" rx="4" fill="#7D7D7D"><title>Shell — 0.4%</title></rect>
      <circle cx="61.0" cy="132.0" r="5" fill="#0A0A0A"/><text x="75.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#262626">Python</text><text x="252.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#666666">74.2%</text>
      <circle cx="283.0" cy="132.0" r="5" fill="#333333"/><text x="297.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#262626">Rust</text><text x="474.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#666666">21.1%</text>
      <circle cx="505.0" cy="132.0" r="5" fill="#595959"/><text x="519.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#262626">C++</text><text x="696.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#666666">4.2%</text>
      <circle cx="727.0" cy="132.0" r="5" fill="#7D7D7D"/><text x="741.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#262626">Shell</text><text x="918.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#666666">0.4%</text>

    <path d="M56 196 h888" stroke="#E0E0E0" stroke-width="1"/>
    <text x="56" y="216" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#808080">bytes per language across Neuroslop-League &#183; top 6 + other</text>
  </g>
  <rect x="1" y="1" width="998" height="228" rx="18" fill="none" stroke="#DCDCDC" stroke-width="1"/>
</svg>
