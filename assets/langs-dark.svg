    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4D4D4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#D4D4D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#2B2B2B" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="228" rx="18"/></clipPath>
  </defs>

