<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="lt">
  <title id="lt">Language split across 1 public Neuroslop-League repositories: Python 100%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#0E0E0E"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4D4D4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#D4D4D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#2B2B2B" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="228" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <rect width="1000" height="230" fill="url(#dots)"/>
    <ellipse cx="60" cy="10" rx="300" ry="150" fill="url(#glowA)"/>
    <ellipse cx="950" cy="230" rx="300" ry="150" fill="url(#glowB)"/>

    <text x="56" y="44" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="3.2" fill="#FFFFFF">LANGUAGES &#183; PUBLIC ORG REPOS</text>
    <text x="944" y="44" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#666666">1 repo &#183; 35.9 kB of code</text>

      <rect x="56.0" y="66" width="888.0" height="26" rx="4" fill="#FFFFFF"><title>Python — 100.0%</title></rect>
      <circle cx="61.0" cy="132.0" r="5" fill="#FFFFFF"/><text x="75.0" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#D4D4D4">Python</text><text x="252.0" y="136" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8E8E8E">100.0%</text>

    <path d="M56 196 h888" stroke="#242424" stroke-width="1"/>
    <text x="56" y="216" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#666666">bytes per language across Neuroslop-League &#183; top 6 + other</text>
  </g>
  <rect x="1" y="1" width="998" height="228" rx="18" fill="none" stroke="#262626" stroke-width="1"/>
</svg>
