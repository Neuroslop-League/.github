<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="lt">
  <title id="lt">Language split across 3 public Neuroslop-League repositories: Rust 35%, Python 34%, CSS 11%, HTML 9%, JavaScript 8%, C++ 3%, Other 0%</title>
  <defs>
